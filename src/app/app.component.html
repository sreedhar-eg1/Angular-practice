<header>
  <h1>Angular Animations</h1>
</header>

<div class="course-container">
  @for (course of courses; track course.title) {
    <app-course
      [course]="course"
      [ngClass]="{ active: course.isActive }"
      (click)="course.isActive = !course.isActive"
    ></app-course>
    }  
</div>

<div class="course-container">
  <app-course
  [course]="courses[0]"
></app-course>
</div>
